# Grafana notification policies — route all Qwen alerts to Telegram admin.
# Schema: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/#notification-policies

apiVersion: 1

# Resets notification policies to state defined here on each Grafana start.
resetPolicies: [1]

policies:
  - orgId: 1
    receiver: qwen-telegram-admin
    group_by: ['alertname', 'rollback_tier']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: qwen-telegram-admin
        matchers:
          - component = qwen
        continue: false
