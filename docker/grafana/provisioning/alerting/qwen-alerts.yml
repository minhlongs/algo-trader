# Grafana-provisioned alert rules for Qwen Solo Platform (Pillar 2 follow-up).
# Schema: Grafana v10 unified alerting — https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
#
# Thresholds derived from PDF Solo Platform doctrine:
#   - L3 drawdown : auto_disabled == 1 for 5m (any breach latches until manual re-enable)
#   - L4 paper gate: ≤5 days remaining of 30-day window (soft early warning)
#   - signals-loop: ≥2 errors in 1h sustained 15m (drift signal, not noise)
#   - L1 kill-sw : env flag active (informational — operator knows why traffic stops)

apiVersion: 1

# Removing a rule from this file will unprovision it on next Grafana start.
deleteRules: []

groups:
  - orgId: 1
    name: qwen-solo-platform-rollback
    folder: Qwen Alerts
    interval: 1m
    rules:

      # ─── L3 drawdown breach — CRITICAL ──────────────────────────────────────
      - uid: qwen-l3-drawdown-breached
        title: QwenDrawdownBreached
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'algo_trader_qwen_drawdown_auto_disabled'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.5] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
          component: qwen
          rollback_tier: L3
        annotations:
          summary: 'Qwen swarm auto-disabled by L3 drawdown breach'
          description: 'Rolling 24h Qwen paper P&L crossed QWEN_DRAWDOWN_MAX_PCT (default -5%). Swarm disabled. Manual re-enable via admin API required after investigation.'
          runbook: 'https://github.com/longtho638-jpg/algo-trader/blob/main/docs/runbooks/qwen-drawdown-breach.md'

      # ─── L4 paper gate ≤5d — WARNING ────────────────────────────────────────
      - uid: qwen-l4-paper-gate-5d
        title: QwenPaperGateLessThan5d
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'algo_trader_qwen_paper_gate_days_remaining'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lte, params: [5] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
        # Alerting (not NoData) because paper-gate metric is load-bearing:
        # prolonged scrape outage must page, not silently hide the gate.
        noDataState: Alerting
        execErrState: Error
        for: 10m
        labels:
          severity: warning
          component: qwen
          rollback_tier: L4
        annotations:
          summary: 'Qwen paper gate <= 5 days remaining'
          description: 'L4 paper-validation window has ≤5 days left before Qwen is eligible to go live. Review 7d win-rate + Sharpe in Grafana dashboard before flipping QWEN_LIVE_ELIGIBLE=true.'
          runbook: 'https://github.com/longtho638-jpg/algo-trader/blob/main/docs/runbooks/qwen-paper-gate.md'

      # ─── Signals-loop error spike — WARNING ─────────────────────────────────
      - uid: qwen-signals-loop-error-spike
        title: QwenSignalsLoopErrorSpike
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'increase(algo_trader_qwen_signals_loop_runs_total{decision="error"}[1h])'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gte, params: [2] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
          component: qwen
          rollback_tier: signals_loop
        annotations:
          summary: 'Qwen signals-loop error rate spike'
          description: '≥2 errored signals-loop runs in the last 1h sustained 15m. Upstream quality drift detector is failing — likely DB connectivity, OTel exporter stall, or compute-metrics regression. Check qwen_signals_loop_runs table for error_message.'
          runbook: 'https://github.com/longtho638-jpg/algo-trader/blob/main/docs/runbooks/qwen-signals-loop-error.md'

      # ─── L1 kill-switch active — INFO ───────────────────────────────────────
      - uid: qwen-l1-kill-switch-active
        title: QwenL1KillSwitchActive
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'algo_trader_qwen_kill_switch_active{source="env"}'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.5] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          severity: info
          component: qwen
          rollback_tier: L1
        annotations:
          summary: 'Qwen L1 env kill-switch is ACTIVE'
          description: 'QWEN_KILL=1 env flag active — all Qwen signals blocked at swarm layer. Operator action: unset env + restart process to re-enable.'

  # ═══ Availability — scrape-level deadman-switch ══════════════════════════
  # Closes the observability loop: if the algo-trader app stops responding to
  # Prometheus scrapes, this rule fires before any L-tier rule has a chance.
  # L3/L1 rules intentionally use `noDataState: OK` (rollback state is latched,
  # absent data is treated as "no breach") — so they are NOT a safety net
  # against backend death. This group is that safety net.
  - orgId: 1
    name: algo-trader-availability
    folder: Qwen Alerts
    interval: 1m
    rules:

      # ─── App scrape deadman — CRITICAL ─────────────────────────────────────
      - uid: algo-trader-deadman
        title: AlgoTraderDeadman
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 180, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'up{job="algo-trader"}'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.5] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
        # NoData here = target missing from scrape config entirely — also a breach.
        noDataState: Alerting
        execErrState: Error
        for: 3m
        labels:
          severity: critical
          component: algo-trader
          rollback_tier: L0
        annotations:
          summary: 'algo-trader /metrics scrape has been down for 3m'
          description: 'Prometheus cannot reach algo-trader:3000/metrics. Backend crash, container OOM, or network partition. All Qwen L-tier alerts are now blind — investigate immediately.'
          runbook: 'https://github.com/longtho638-jpg/algo-trader/blob/main/docs/runbooks/algo-trader-deadman.md'

      # ─── Signals-loop freshness — WARNING ──────────────────────────────────
      # Deadman catches process death. This catches internal job stall:
      # the 6h cron timer died while the process stayed alive. Expressed as
      # `time() - last_journal_write_ts`, not counter rate — rate would
      # false-fire during cold-start before the first run.
      - uid: qwen-signals-loop-stale
        title: QwenSignalsLoopStale
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              # 6h cron interval + 1h grace = 25200s. Fires if no run in 7h.
              expr: 'time() - algo_trader_qwen_signals_loop_last_run_ts'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [25200] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
        # NoData = gauge never emitted (cold-start loop-init regression) — breach.
        noDataState: Alerting
        execErrState: Error
        for: 10m
        labels:
          severity: warning
          component: algo-trader
          rollback_tier: signals_loop
        annotations:
          summary: 'qwen-signals-loop has not run in 7h+ (6h cron stalled)'
          description: 'The 6h signals-loop cron has not written a journal row in more than 7h. Timer died silently, init regressed, or persistRunJournal throws. Quality-drift detection is blind. Restart + investigate last journal row timestamp.'
          runbook: 'https://github.com/longtho638-jpg/algo-trader/blob/main/docs/runbooks/qwen-signals-loop-stale.md'

      # ─── Drawdown-monitor freshness — WARNING ──────────────────────────────
      # Symmetric companion to qwen-signals-loop-stale. The 6h drawdown check
      # runs via its own setInterval — if that timer dies while the process
      # stays alive, L3 state gauges freeze at last-known value (likely 0 =
      # enabled) even if real P&L is breaching. Scrape-deadman won't catch it
      # because /metrics still serves.
      - uid: qwen-drawdown-monitor-stale
        title: QwenDrawdownMonitorStale
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'time() - algo_trader_qwen_drawdown_monitor_last_run_ts'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [25200] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
        # NoData = gauge never emitted (startDrawdownMonitor never called) → breach.
        noDataState: Alerting
        execErrState: Error
        for: 10m
        labels:
          severity: warning
          component: algo-trader
          rollback_tier: drawdown_monitor
        annotations:
          summary: 'qwen-drawdown-monitor has not ticked in 7h+ (6h cron stalled)'
          description: 'The 6h drawdown-monitor cron has not invoked runDrawdownCheck in more than 7h. L3 auto-disable protection is silently disarmed — real drawdown breaches will not be caught. Restart + investigate startup init.'
          runbook: 'https://github.com/longtho638-jpg/algo-trader/blob/main/docs/runbooks/qwen-drawdown-monitor-stale.md'
