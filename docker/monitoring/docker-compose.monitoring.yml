# Monitoring stack override — usage:
# docker compose -f docker-compose.yml -f docker/monitoring/docker-compose.monitoring.yml up

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: algo-prometheus
    restart: unless-stopped
    ports:
      - '9095:9090'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - algo-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: algo-grafana
    restart: unless-stopped
    ports:
      - '3035:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/trading-performance.json
      # Forwarded for alerting/contact-points.yml — Telegram admin bot re-use.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - algo-net

  # ── Backing-Service Prometheus Exporters ───────────────────────────────────────

  postgres-exporter:
    image: wrouesnel/postgres_exporter:v0.16.0
    container_name: algo-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/algo_trader?sslmode=disable
    ports:
      - '9187:9187'
    networks:
      - algo-net
    deploy:
      resources:
        limits:
          memory: 128M

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.16.0
    container_name: algo-nats-exporter
    restart: unless-stopped
    command:
      - '-connz'
      - '-routez'
      - '-subz'
      - '-varz'
      - '-http_port=7777'
    ports:
      - '7777:7777'
    networks:
      - algo-net
    deploy:
      resources:
        limits:
          memory: 128M

  redis-exporter:
    image: oliver006/redis_exporter:v1.63.0
    container_name: algo-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - '9121:9121'
    networks:
      - algo-net
    deploy:
      resources:
        limits:
          memory: 128M

# Use the same network as base compose
networks:
  algo-net:
    external: true
    name: algo-trader_algo-net

volumes:
  prometheus_data:
  grafana_data:
