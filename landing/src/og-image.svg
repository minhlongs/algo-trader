<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glowTL" cx="0%" cy="0%"><stop offset="0%" stop-color="#F59E0B" stop-opacity="0.12"/><stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowBR" cx="100%" cy="100%"><stop offset="0%" stop-color="#00D9FF" stop-opacity="0.08"/><stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#F59E0B" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#060912"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow orbs -->
  <circle cx="0" cy="0" r="300" fill="url(#glowTL)"/>
  <circle cx="1200" cy="630" r="300" fill="url(#glowBR)"/>

  <!-- Logo triangle -->
  <polygon points="600,195 575,240 625,240" fill="url(#logoGrad)" opacity="0.9"/>

  <!-- Badge -->
  <rect x="480" y="268" width="240" height="30" rx="15" fill="none" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1"/>
  <text x="600" y="288" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="12" letter-spacing="3">RaaS PLATFORM · GO-LIVE 2026</text>

  <!-- Headline -->
  <text x="600" y="352" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="46" font-weight="bold" letter-spacing="-1">
    <tspan x="600" dy="0"><tspan fill="#F59E0B">CashClaw</tspan> — AI-Calibrated</tspan>
    <tspan x="600" dy="54">Prediction Market Signals</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="440" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="18">
    <tspan x="600" dy="0">52+ Strategies. Kelly-Optimal Position Sizing.</tspan>
    <tspan x="600" dy="28">Subscribe. Get Signals. Trade.</tspan>
  </text>

  <!-- Stats row -->
  <!-- 52+ Strategies -->
  <text x="320" y="500" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="28" font-weight="bold">52+</text>
  <text x="320" y="524" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="12" letter-spacing="2">STRATEGIES</text>

  <!-- 2,430+ Tests -->
  <text x="460" y="500" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="28" font-weight="bold">2,430+</text>
  <text x="460" y="524" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="12" letter-spacing="2">TESTS</text>

  <!-- ~85% Margin -->
  <text x="600" y="500" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="28" font-weight="bold">~85%</text>
  <text x="600" y="524" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="12" letter-spacing="2">MARGIN</text>

  <!-- Pricing -->
  <text x="740" y="500" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="28" font-weight="bold">$49–499</text>
  <text x="740" y="524" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="12" letter-spacing="2">PER MONTH</text>

  <!-- Zero Type Errors -->
  <text x="900" y="500" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="28" font-weight="bold">0</text>
  <text x="900" y="524" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="12" letter-spacing="2">TS ERRORS</text>

  <!-- URL -->
  <text x="600" y="590" text-anchor="middle" fill="#334155" font-family="monospace" font-size="14" letter-spacing="2">cashclaw.cc</text>

  <!-- Bottom line -->
  <line x1="200" y1="555" x2="1000" y2="555" stroke="#1E293B" stroke-width="1"/>
</svg>
