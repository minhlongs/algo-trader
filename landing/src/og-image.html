<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #060912;
    font-family: 'Courier New', monospace;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }
  /* Grid lines */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(245,158,11,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,158,11,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  /* Glow orbs */
  .glow-tl {
    position: absolute; top: -100px; left: -100px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(245,158,11,0.12) 0%, transparent 70%);
    border-radius: 50%;
  }
  .glow-br {
    position: absolute; bottom: -100px; right: -100px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(0,217,255,0.08) 0%, transparent 70%);
    border-radius: 50%;
  }
  /* Content */
  .content {
    position: relative; z-index: 1;
    text-align: center;
    padding: 60px 80px;
  }
  .badge {
    display: inline-block;
    border: 1px solid rgba(245,158,11,0.4);
    border-radius: 20px;
    padding: 6px 20px;
    color: #F59E0B;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 32px;
  }
  .logo-row {
    display: flex; align-items: center; justify-content: center; gap: 16px;
    margin-bottom: 20px;
  }
  .logo-icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, #F59E0B, #D97706);
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  }
  h1 {
    color: #F8FAFC;
    font-size: 52px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.15;
    margin-bottom: 16px;
  }
  h1 span { color: #F59E0B; }
  .subtitle {
    color: rgba(248,250,252,0.6);
    font-size: 20px;
    letter-spacing: 0.5px;
    margin-bottom: 40px;
    line-height: 1.4;
  }
  .stats-row {
    display: flex; gap: 48px; justify-content: center;
  }
  .stat {
    text-align: center;
  }
  .stat-value {
    color: #F59E0B;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .stat-label {
    color: rgba(248,250,252,0.4);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 4px;
  }
  .url {
    position: absolute; bottom: 40px; left: 0; right: 0;
    text-align: center;
    color: rgba(248,250,252,0.3);
    font-size: 16px;
    letter-spacing: 2px;
  }
  /* Candlestick decoration */
  .candle {
    position: absolute; bottom: 180px; right: 120px;
    display: flex; gap: 6px; align-items: flex-end;
    opacity: 0.15;
  }
  .candle-bar {
    width: 3px; background: #F59E0B;
  }
  .candle-body {
    width: 12px; background: #F59E0B; margin: 0 -4px;
  }
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow-tl"></div>
<div class="glow-br"></div>

<div class="content">
  <div class="badge">RaaS Platform · Go-Live 2026</div>
  <h1><span>CashClaw</span> — AI-Calibrated<br>Prediction Market Signals</h1>
  <p class="subtitle">52+ Strategies. Kelly-Optimal Position Sizing.<br>Subscribe. Get Signals. Trade.</p>
  <div class="stats-row">
    <div class="stat"><div class="stat-value">52+</div><div class="stat-label">Strategies</div></div>
    <div class="stat"><div class="stat-value">2,430+</div><div class="stat-label">Tests</div></div>
    <div class="stat"><div class="stat-value">~85%</div><div class="stat-label">Margin</div></div>
    <div class="stat"><div class="stat-value">$49-499</div><div class="stat-label">Per Month</div></div>
  </div>
</div>

<div class="url">cashclaw.cc</div>
</body>
</html>
