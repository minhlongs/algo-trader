[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-trading"
version = "0.1.0"
description = "Reinforcement Learning Framework for Algorithmic Trading"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "AlgoTrader Team"}]
keywords = ["reinforcement learning", "trading", "gymnasium", "stable-baselines3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "gymnasium>=0.28.0",
    "stable-baselines3>=2.0.0",
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "ta>=0.10.0",
    "matplotlib>=3.5.0",
    "pyyaml>=6.0",
    "tensorboard>=2.12.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

docs = []

[tool.setuptools.packages.find]
where = ["."]
include = ["rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=rl --cov-report=term-missing --cov-report=html"
