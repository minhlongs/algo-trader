  # ── Backtest (additional sub-routes) ───────────────────────────────────────

  /api/backtest/{id}:
    get:
      tags: [Trading]
      summary: Get backtest result by ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Backtest result
        '404':
          description: Backtest not found
        '500':
          description: Internal server error

  /api/backtest/history:
    get:
      tags: [Trading]
      summary: List backtest history
      responses:
        '200':
          description: Backtest history list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    strategyName: { type: string }
                    pair: { type: string }
                    timeframe: { type: string }
                    days: { type: integer }
                    sharpeRatio: { type: number }
                    maxDrawdownPct: { type: number }
                    totalReturnPct: { type: number }
                    createdAt: { type: string, format: date-time }
        '500':
          description: Internal server error

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key

  schemas:
    Trade:
      type: object
      properties:
        id: { type: string }
        symbol: { type: string }
        exchange: { type: string }
        side: { type: string, enum: [BUY, SELL] }
        entryPrice: { type: number }
        exitPrice: { type: number }
        quantity: { type: number }
        pnl: { type: number }
        status: { type: string, enum: [OPEN, CLOSED] }

    Signal:
      type: object
      properties:
        id: { type: string }
        ts: { type: integer }
        market: { type: string }
        side: { type: string, enum: [BUY, SELL] }
        size: { type: number }
        confidence: { type: number }
        strategy: { type: string }
        ttl: { type: integer }

    Subscription:
      type: object
      properties:
        id: { type: string }
        subscriberId: { type: string }
        tier: { type: string, enum: [FREE, PRO, ENTERPRISE] }
        active: { type: boolean }

    PerformanceMetrics:
      type: object
      properties:
        totalTrades: { type: integer }
        winRate: { type: number }
        totalPnl: { type: number }

    DailySummary:
      type: object
      properties:
        date: { type: string }
        trades: { type: integer }
        pnl: { type: number }

    BacktestConfig:
      type: object
      properties:
        startDate: { type: string }
        endDate: { type: string }
        initialCapital: { type: number }
        exchanges: { type: array, items: { type: string } }

    BacktestResult:
      type: object
      properties:
        id: { type: string }
        sharpeRatio: { type: number }
        maxDrawdown: { type: number }
        netProfitPct: { type: number }

    VaRResult:
      type: object
      properties:
        var: { type: number }
        cvar: { type: number }

    DrawdownMetrics:
      type: object
      properties:
        currentDrawdown: { type: number }
        maxDrawdown: { type: number }
        isHalted: { type: boolean }

    RevenueSummary:
      type: object
      properties:
        mrr: { type: number }
        totalCustomers: { type: integer }
        churnRate: { type: number }

    ChurnMetrics:
      type: object
      properties:
        period: { type: string }
        churnRate: { type: number }

    Review:
      type: object
      properties:
        id: { type: string }
        strategyId: { type: string }
        rating: { type: integer }
        content: { type: string }

    ReferralStats:
      type: object
      properties:
        totalClicks: { type: integer }
        totalConversions: { type: integer }
        commissionEarned: { type: number }

    ReferralCode:
      type: object
      properties:
        code: { type: string }
        tenantId: { type: string }

    SystemStatus:
      type: object
      properties:
        trading: { type: boolean }
        circuitBreaker: { type: object }

    KycVerification:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected, expired]
        verificationId: { type: string, description: Persona verification ID }
        templateId: { type: string }
        createdAt: { type: string, format: date-time }
        verifiedAt: { type: string, format: date-time, nullable: true }

    ComplianceResult:
      type: object
      properties:
        allowed: { type: boolean }
        violations:
          type: array
          items:
            type: object
            properties:
              ruleId: { type: string }
              ruleName: { type: string }
              message: { type: string }
              severity: { type: string, enum: [warning, block] }

    ComplianceRule:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        type: { type: string }
        config: { type: object }

    AuditEntry:
      type: object
      properties:
        id: { type: string }
        ruleId: { type: string }
        ruleName: { type: string }
        tenantId: { type: string }
        action: { type: string }
        result: { type: string }
        details: { type: object }
        timestamp: { type: string, format: date-time }

    Dispute:
      type: object
      properties:
        id: { type: string }
        strategyId: { type: string }
        reporterUserId: { type: string }
        reason: { type: string }
        status: { type: string, enum: [open, resolved, escalated] }
        resolution: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }

    VettingDecision:
      type: object
      properties:
        decision: { type: string, enum: [approve, reject] }
        notes: { type: string }

    CommunityStrategy:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        authorUserId: { type: string }
        language: { type: string }
        strategyType: { type: string }
        sourceCode: { type: string }
        sandboxStatus: { type: string, enum: [pending, passed, failed] }
        backtestResult: { type: object }
        createdAt: { type: string, format: date-time }

    ApiKey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        keyPrefix: { type: string }
        scopes: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }

    AIDecision:
      type: object
      properties:
        id: { type: string }
        ruleId: { type: string }
        ruleName: { type: string }
        action: { type: string }
        result: { type: string }
        details: { type: object }
        createdAt: { type: string, format: date-time }

    LeaderboardEntry:
      type: object
      properties:
        strategyId: { type: string }
        strategyName: { type: string }
        tenantId: { type: string }
        winRate: { type: number }
        sharpeRatio: { type: number }
        totalReturnPct: { type: number }
        maxDrawdownPct: { type: number }
        profitFactor: { type: number }
        totalTrades: { type: integer }
