openapi: 3.0.3
info:
  title: Algo Trader API
  description: Algorithmic trading platform API
  version: 3.1.9
  license: { name: Proprietary }

servers:
  - url: http://localhost:8787
    description: Local dev
  - url: https://algo-trader.workers.dev
    description: Production

security: [{ BearerAuth: [] }]

tags:
  - name: Trading
  - name: Signals
  - name: Risk
  - name: Revenue
  - name: Marketplace
  - name: Referral
  - name: Co-pilot
  - name: Admin
  - name: Community
  - name: Subscriptions
  - name: Audit
  - name: RUM
  - name: Leaderboard
  - name: KYC
  - name: Compliance

paths:
  /api/trades:
    get:
      tags: [Trading]
      summary: List trades
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: symbol, in: query, schema: { type: string } }
      responses:
        '200':
          description: Trades
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Trade' } }

  /api/trades/{id}:
    get:
      tags: [Trading]
      summary: Get trade
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Trade
          content: { application/json: { schema: { $ref: '#/components/schemas/Trade' } } }

  /api/positions/{id}/close:
    post:
      tags: [Trading]
      summary: Close position
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, exchange, exitPrice]
              properties:
                symbol: { type: string }
                exchange: { type: string }
                exitPrice: { type: number }
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema:
                type: object
                properties: { success: { type: boolean }, pnl: { type: number } }

  /api/pnl:
    get:
      tags: [Trading]
      summary: Performance metrics
      responses:
        '200':
          description: Metrics
          content: { application/json: { schema: { $ref: '#/components/schemas/PerformanceMetrics' } } }

  /api/pnl/daily:
    get:
      tags: [Trading]
      summary: Daily P&L
      parameters: [{ name: date, in: query, schema: { type: string } }]
      responses:
        '200':
          description: Summary
          content: { application/json: { schema: { $ref: '#/components/schemas/DailySummary' } } }

  /api/backtest:
    post:
      tags: [Trading]
      summary: Run backtest
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BacktestConfig' } } }
      responses:
        '200':
          description: Result
          content: { application/json: { schema: { $ref: '#/components/schemas/BacktestResult' } } }

  /api/v1/signals:
    get:
      tags: [Signals]
      summary: Get signals
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: minSpread, in: query, schema: { type: number } }
      responses:
        '200':
          description: Signals
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Signal' } }

  /api/v1/signals/{id}:
    get:
      tags: [Signals]
      summary: Get signal
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Signal
          content: { application/json: { schema: { $ref: '#/components/schemas/Signal' } } }

  /api/v1/signals/stream:
    get:
      tags: [Signals]
      summary: SSE stream (ENTERPRISE)
      responses: { '200': { description: Stream } }

  /api/v1/subscriptions:
    post:
      tags: [Signals]
      summary: Create subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties: { tier: { type: string, enum: [FREE, PRO, ENTERPRISE] } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } }

  /api/v1/subscriptions/active:
    get:
      tags: [Signals]
      summary: List active
      responses:
        '200':
          description: List
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array } } }

  /api/v1/subscriptions/{id}:
    delete:
      tags: [Signals]
      summary: Cancel
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Cancelled } }

  /api/v1/risk/var:
    post:
      tags: [Risk]
      summary: VaR/CVaR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positions]
              properties: { positions: { type: array } }
      responses:
        '200':
          description: VaR
          content: { application/json: { schema: { $ref: '#/components/schemas/VaRResult' } } }

  /api/v1/risk/drawdown:
    get:
      tags: [Risk]
      summary: Drawdown
      responses:
        '200':
          description: Metrics
          content: { application/json: { schema: { $ref: '#/components/schemas/DrawdownMetrics' } } }

  /api/v1/risk/atr/stop:
    post:
      tags: [Risk]
      summary: ATR stop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, exchange, entryPrice]
              properties:
                symbol: { type: string }
                exchange: { type: string }
                entryPrice: { type: number }
      responses:
        '200':
          description: Stop
          content:
            application/json:
              schema: { type: object, properties: { stopPrice: { type: number } } }

  /api/v1/risk/kelly/size:
    post:
      tags: [Risk]
      summary: Kelly sizing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [winRate, avgWin, avgLoss]
              properties:
                winRate: { type: number }
                avgWin: { type: number }
                avgLoss: { type: number }
      responses:
        '200':
          description: Fraction
          content:
            application/json:
              schema: { type: object, properties: { kellyFraction: { type: number } } }

  /api/revenue/summary:
    get:
      tags: [Revenue]
      summary: Summary
      responses:
        '200':
          description: Summary
          content: { application/json: { schema: { $ref: '#/components/schemas/RevenueSummary' } } }

  /api/revenue/mrr:
    get:
      tags: [Revenue]
      summary: MRR
      responses:
        '200':
          description: MRR
          content:
            application/json:
              schema: { type: object, properties: { mrr: { type: number } } }

  /api/revenue/churn:
    get:
      tags: [Revenue]
      summary: Churn
      responses:
        '200':
          description: Churn
          content: { application/json: { schema: { $ref: '#/components/schemas/ChurnMetrics' } } }

  /api/v1/marketplace/reviews:
    post:
      tags: [Marketplace]
      summary: Create review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [strategyId, rating, content]
              properties:
                strategyId: { type: string }
                rating: { type: integer, minimum: 1, maximum: 5 }
                content: { type: string }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } }

  /api/v1/marketplace/reviews/strategies/{id}:
    get:
      tags: [Marketplace]
      summary: List reviews
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array } } }

  /api/v1/referral/stats:
    get:
      tags: [Referral]
      summary: Stats
      responses:
        '200':
          description: Stats
          content: { application/json: { schema: { $ref: '#/components/schemas/ReferralStats' } } }

  /api/v1/referral/generate-code:
    post:
      tags: [Referral]
      summary: Generate code
      responses:
        '201':
          description: Code
          content: { application/json: { schema: { $ref: '#/components/schemas/ReferralCode' } } }

  /api/v1/co-pilot/ask:
    post:
      tags: [Co-pilot]
      summary: Ask question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties: { question: { type: string } }
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties: { answer: { type: string }, confidence: { type: number } }

  /api/admin/halt:
    post:
      tags: [Admin]
      summary: Halt trading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string } }
      responses: { '200': { description: Halted } }

  /api/admin/resume:
    post:
      tags: [Admin]
      summary: Resume trading
      responses: { '200': { description: Resumed } }

  /api/admin/status:
    get:
      tags: [Admin]
      summary: System status
      responses:
        '200':
          description: Status
          content: { application/json: { schema: { $ref: '#/components/schemas/SystemStatus' } } }

  /api/kyc/init:
    post:
      tags: [KYC]
      summary: Initiate KYC verification (PRO+)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateId]
              properties:
                templateId:
                  type: string
                  description: Persona verification template ID
      responses:
        '200':
          description: KYC verification initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycVerification'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

  /api/kyc/status:
    get:
      tags: [KYC]
      summary: Get current tenant KYC status (FREE+)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: KYC status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycVerification'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /api/kyc/status/{tenantId}:
    get:
      tags: [KYC]
      summary: "Admin: get any tenant KYC status (ENTERPRISE only)"
      security:
        - BearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: KYC status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycVerification'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

  /api/kyc/webhook:
    post:
      tags: [KYC]
      summary: Persona verification webhook callback (no auth)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantId:
                  type: string
                status:
                  type: string
                  enum: [approved, rejected, pending, expired]
                id:
                  type: string
                  description: Persona verification ID
      responses:
        '200':
          description: Webhook processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  verificationId:
                    type: string
                  status:
                    type: string
        '401':
          description: Invalid webhook signature
        '500':
          description: Internal server error

  /api/compliance/validate:
    post:
      tags: [Compliance]
      summary: Validate trade against compliance rules
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, side, quantity, price]
              properties:
                symbol:
                  type: string
                side:
                  type: string
                  enum: [buy, sell]
                quantity:
                  type: number
                price:
                  type: number
                tenantId:
                  type: string
      responses:
        '200':
          description: Compliance validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceResult'
        '400':
          description: Bad request
        '500':
          description: Internal server error

  /api/compliance/rules:
    get:
      tags: [Compliance]
      summary: List all compliance rules
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of compliance rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComplianceRule'
        '500':
          description: Internal server error

  /api/compliance/rules/{id}/toggle:
    put:
      tags: [Compliance]
      summary: Enable/disable a compliance rule
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Rule toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceRule'
        '404':
          description: Not found
        '500':
          description: Internal server error

  /api/compliance/audit:
    get:
      tags: [Compliance]
      summary: Get last 100 compliance audit log entries
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
        '500':
          description: Internal server error

  # ── Admin Marketplace (disputes, revenue, vetting) ──────────────────────────

  /api/v1/admin/marketplace/disputes:
    get:
      tags: [Admin]
      summary: List marketplace disputes
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Dispute list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Dispute' } }
                  total: { type: integer }
        '403':
          description: Admin access required
        '500':
          description: Internal server error

  /api/v1/admin/marketplace/revenue:
    get:
      tags: [Admin]
      summary: Platform revenue overview
      parameters:
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: creatorId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Revenue overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalRevenue: { type: number }
                  creatorPayouts: { type: number }
                  platformFee: { type: number }
                  period: { type: string }
        '403':
          description: Admin access required
        '500':
          description: Internal server error

  /api/v1/admin/marketplace/revenue/mark-paid:
    post:
      tags: [Admin]
      summary: Batch mark revenue shares as paid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, stripePayoutId]
              properties:
                ids: { type: array, items: { type: string } }
                stripePayoutId: { type: string }
      responses:
        '200':
          description: Batch result
          content:
            application/json:
              schema:
                type: object
                properties:
                  paid: { type: integer }
                  errors: { type: integer }
                  results: { type: array }
        '403':
          description: Admin access required
        '500':
          description: Internal server error

  /api/v1/admin/marketplace/vetting/strategies/pending:
    get:
      tags: [Admin]
      summary: List pending vetting strategies
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Pending strategies
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array }
                  total: { type: integer }
        '403':
          description: Admin access required
        '500':
          description: Internal server error

  /api/v1/admin/marketplace/vetting/strategies/{id}/vetting/decision:
    post:
      tags: [Admin]
      summary: Approve or reject strategy
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                notes: { type: string }
      responses:
        '200':
          description: Decision recorded
        '403':
          description: Admin access required
        '404':
          description: Strategy not found
        '500':
          description: Internal server error

  # ── Admin DNA ──────────────────────────────────────────────────────────────

  /api/v1/admin/dna/status:
    get:
      tags: [Admin]
      summary: DNA engine status
      responses:
        '200':
          description: Engine state
          content:
            application/json:
              schema:
                type: object
                properties:
                  running: { type: boolean }
                  paperMode: { type: boolean }
                  lastTick: { type: string, format: date-time }
                  lastConsensus: { type: object }
        '503':
          description: DNA engine not started
        '500':
          description: Internal server error

  /api/v1/admin/dna/journal:
    get:
      tags: [Admin]
      summary: DNA engine paper journal entries
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Journal entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array }
                  total: { type: integer }
        '500':
          description: Internal server error

  /api/v1/admin/dna-legacy/status:
    get:
      tags: [Admin]
      summary: DNA engine status (legacy)
      responses:
        '200':
          description: Engine state
        '503':
          description: DNA engine not running
        '500':
          description: Internal server error

  /api/v1/admin/dna-legacy/start:
    post:
      tags: [Admin]
      summary: Start DNA engine
      responses:
        '200':
          description: Engine started
        '500':
          description: Internal server error

  /api/v1/admin/dna-legacy/stop:
    post:
      tags: [Admin]
      summary: Stop DNA engine
      responses:
        '200':
          description: Engine stopped
        '500':
          description: Internal server error

  /api/v1/admin/dna-legacy/config:
    post:
      tags: [Admin]
      summary: Update DNA engine config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paperMode: { type: boolean }
      responses:
        '200':
          description: Config updated
        '503':
          description: DNA engine not running
        '500':
          description: Internal server error

  # ── Marketplace (insights, listings, management) ───────────────────────────

  /api/v1/marketplace/insights/strategies/{id}/performance:
    get:
      tags: [Marketplace]
      summary: Strategy performance metrics
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: days, in: query, schema: { type: integer, default: 30 } }
      responses:
        '200':
          description: Performance data
          content:
            application/json:
              schema:
                type: object
                properties:
                  sharpeRatio: { type: number }
                  maxDrawdownPct: { type: number }
                  totalReturnPct: { type: number }
                  winRate: { type: number }
                  profitFactor: { type: number }
                  totalTrades: { type: integer }
        '404':
          description: Strategy not found
        '500':
          description: Internal server error

  /api/v1/marketplace/insights/strategies/{id}/reviews:
    get:
      tags: [Marketplace]
      summary: Strategy reviews
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Reviews list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array }
                  total: { type: integer }
        '404':
          description: Strategy not found
        '500':
          description: Internal server error

  /api/v1/marketplace/insights/strategies/{id}/backtests:
    get:
      tags: [Marketplace]
      summary: Strategy backtest history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Backtests list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array }
                  total: { type: integer }
        '500':
          description: Internal server error

  /api/v1/marketplace/listings/strategies:
    get:
      tags: [Marketplace]
      summary: List published marketplace strategies
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Strategy list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array }
                  total: { type: integer }
        '500':
          description: Internal server error

  /api/v1/marketplace/listings/strategies/{id}:
    get:
      tags: [Marketplace]
      summary: Get strategy details
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Strategy details with performance and reviews
        '404':
          description: Strategy not found
        '500':
          description: Internal server error

  /api/v1/marketplace/management/strategies/{id}:
    patch:
      tags: [Marketplace]
      summary: Update marketplace strategy
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                priceUsdMonthly: { type: number }
      responses:
        '200':
          description: Strategy updated
        '403':
          description: Forbidden (not strategy owner)
        '404':
          description: Strategy not found
        '500':
          description: Internal server error

  /api/v1/marketplace/management/strategies/{id}/vetting/request:
    post:
      tags: [Marketplace]
      summary: Submit strategy for vetting
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Submitted for vetting
        '403':
          description: Forbidden
        '404':
          description: Strategy not found
        '500':
          description: Internal server error

  # ── Community ──────────────────────────────────────────────────────────────

  /api/v1/marketplace/community/strategies:
    get:
      tags: [Community]
      summary: List community strategies (approved)
      parameters:
