  # ── RUM ────────────────────────────────────────────────────────────────────

  /api/v1/rum/ingest:
    post:
      tags: [RUM]
      summary: Ingest client-side performance metrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, timestamp, metrics]
              properties:
                sessionId: { type: string }
                userId: { type: string }
                timestamp: { type: integer }
                metrics:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      value: { type: number }
                      rating: { type: string }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  processed: { type: integer }
                  timeMs: { type: integer }
        '400':
          description: Invalid payload
        '500':
          description: Processing error (still returns 202)

