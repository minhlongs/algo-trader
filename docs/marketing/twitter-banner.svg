<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <radialGradient id="glowC" cx="50%" cy="50%"><stop offset="0%" stop-color="#F59E0B" stop-opacity="0.08"/><stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#F59E0B" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F59E0B" stop-opacity="0"/><stop offset="50%" stop-color="#F59E0B" stop-opacity="0.5"/><stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/></linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="#060912"/>
  <rect width="1500" height="500" fill="url(#grid)"/>

  <!-- Center glow -->
  <circle cx="750" cy="250" r="400" fill="url(#glowC)"/>

  <!-- Logo triangle -->
  <polygon points="750,115 715,175 785,175" fill="url(#logoGrad)" opacity="0.95"/>

  <!-- Brand name -->
  <text x="750" y="235" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="48" font-weight="bold" letter-spacing="-1">CashClaw</text>

  <!-- Divider line -->
  <line x1="400" y1="260" x2="1100" y2="260" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- Tagline -->
  <text x="750" y="300" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="20" letter-spacing="1">AI-CALIBRATED PREDICTION MARKET SIGNALS</text>

  <!-- Sub-tagline -->
  <text x="750" y="335" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="15" letter-spacing="2">52+ STRATEGIES · KELLY-OPTIMAL SIZING · RaaS PLATFORM</text>

  <!-- Bottom bar -->
  <rect x="0" y="470" width="1500" height="30" fill="#F59E0B" fill-opacity="0.05"/>
  <text x="750" y="490" text-anchor="middle" fill="#475569" font-family="monospace" font-size="12" letter-spacing="3">cashclaw.cc</text>

  <!-- Left decor -->
  <line x1="80" y1="200" x2="80" y2="300" stroke="#F59E0B" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="80" y1="200" x2="120" y2="200" stroke="#F59E0B" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Right decor -->
  <line x1="1420" y1="200" x2="1420" y2="300" stroke="#F59E0B" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="1380" y1="200" x2="1420" y2="200" stroke="#F59E0B" stroke-opacity="0.08" stroke-width="1"/>
</svg>
