# =============================================================================
# Algo-Trade Production Stack — Docker Compose
# Services: app + Redis + NATS + PostgreSQL + Prometheus + Grafana
# =============================================================================

services:
  # ── Main Application ────────────────────────────────────────────────────────
  algo-trade:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algo-trade
    restart: unless-stopped
    ports:
      - "3000:3000"   # API + health
      - "3001:3001"   # Dashboard
      - "3002:3002"   # Webhooks
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://algo:${DB_PASSWORD}@postgres:5432/algo_trade
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - algo-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ── Redis (Cache + Pub/Sub) ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: algo-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - algo-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ── NATS (Message Bus) ──────────────────────────────────────────────────────
  nats:
    image: nats:2-alpine
    container_name: algo-nats
    restart: unless-stopped
    command: ["nats-server", "-js", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - algo-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ── PostgreSQL (Persistent Storage) ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: algo-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=algo
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
      - POSTGRES_DB=algo_trade
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo -d algo_trade"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - algo-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Prometheus (Metrics) ─────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: algo-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - algo-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Grafana (Dashboard) ──────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: algo-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/monitoring/grafana-datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - algo-net
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  redis-data:
  nats-data:
  pg-data:
  prometheus-data:
  grafana-data:

networks:
  algo-net:
    driver: bridge
