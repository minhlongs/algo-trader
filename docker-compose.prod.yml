# =============================================================================
# Algo-Trade Production Stack — Docker Compose
# Services: app + Redis + NATS + PostgreSQL + Prometheus + Grafana + Loki
# =============================================================================
services:
  # ── Main Application ────────────────────────────────────────────────────────
  algo-trade:
    image: ghcr.io/algo-trade/algo-trader-algo-trader:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algo-trade
    restart: unless-stopped
    ports:
      - "3000:3000"   # API + health
      - "3001:3001"   # Dashboard
      - "3002:3002"   # Webhooks
    env_file: .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - LOG_BACKEND=http://loki:3100/loki/api/v1/push
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - algo-net

  # ── Grafana Loki (Log Aggregation) ──────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.4
    container_name: algo-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./config/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - algo-net

  # ── Promtail (Log Shipper — reads container logs, forwards to Loki) ─────────
  promtail:
    image: grafana/promtail:2.9.4
    container_name: algo-promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - algo-net

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: algo-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - algo-net

  # ── NATS ────────────────────────────────────────────────────────────────────
  nats:
    image: nats:2-alpine
    container_name: algo-nats
    restart: unless-stopped
    ports:
      - '4222:4222'
      - '8222:8222'
    volumes:
      - nats-data:/data
    command: nats -js --store_dir /data --http_port 8222
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - algo-net

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: algo-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-algo_trade}
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-algo_trade}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - algo-net

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: algo-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - algo-net

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: algo-grafana
    restart: unless-stopped
    ports:
      - '3003:3000'
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?Set GF_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - algo-net

  # ── Redis Exporter (Prometheus metrics) ─────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.63.0
    container_name: algo-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - '9121:9121'
    depends_on:
      - redis
    networks:
      - algo-net

  # ── NATS Exporter (Prometheus metrics) ──────────────────────────────────────
  nats-exporter:
    image: natsio/nats-exporter:latest
    container_name: algo-nats-exporter
    restart: unless-stopped
    command: -varz -connz -channelz -subz -serverz http://nats:8222
    ports:
      - '7777:7777'
    depends_on:
      - nats
    networks:
      - algo-net

  # ── PostgreSQL Exporter (Prometheus metrics) ────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: algo-postgres-exporter
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-algo_trade}?sslmode=disable
    ports:
      - '9187:9187'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - algo-net

volumes:
  redis-data:
  nats-data:
  pg-data:
  prometheus-data:
  grafana-data:
  loki-data:
networks:
  algo-net:
    driver: bridge
