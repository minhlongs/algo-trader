<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_4 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_4" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_4');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const scene = new THREE.Scene();
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
container.appendChild(renderer.domElement);

// Gold color from design system: #F59E0B
const goldColor = 0xF59E0B;

// Create a terminal "frame" - a floating glass panel
const geometry = new THREE.BoxGeometry(4, 2.5, 0.1);
const material = new THREE.MeshPhongMaterial({ 
    color: 0x1c1b1c, 
    transparent: true, 
    opacity: 0.8,
    shininess: 100
});
const terminal = new THREE.Mesh(geometry, material);
scene.add(terminal);

// Add "code lines" as small emissive strips
for(let i = 0; i < 15; i++) {
    const lineGeo = new THREE.PlaneGeometry(3.5, 0.05);
    const lineMat = new THREE.MeshBasicMaterial({ 
        color: goldColor, 
        transparent: true, 
        opacity: Math.random() * 0.5 + 0.2 
    });
    const line = new THREE.Mesh(lineGeo, lineMat);
    line.position.set(0, 1 - (i * 0.15), 0.06);
    terminal.add(line);
}

// Lighting
const light = new THREE.PointLight(goldColor, 2, 10);
light.position.set(2, 2, 2);
scene.add(light);
const ambient = new THREE.AmbientLight(0xffffff, 0.2);
scene.add(ambient);

camera.position.z = 5;

function animate() {
    requestAnimationFrame(animate);
    
    terminal.rotation.y = Math.sin(Date.now() * 0.001) * 0.1;
    terminal.rotation.x = Math.cos(Date.now() * 0.001) * 0.05;
    
    // Flicker lines
    terminal.children.forEach(child => {
        if(Math.random() > 0.95) child.visible = !child.visible;
    });

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_4 -->
</body>
</html>
