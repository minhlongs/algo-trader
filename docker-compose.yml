# Base compose — app + essential infrastructure
# For full production stack: ./scripts/start-production.sh

services:
  algo-trade:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algo-trade
    restart: unless-stopped
    ports:
      - '3000:3000'   # API + /metrics
      - '3002:3002'   # Webhooks
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://algo:${DB_PASSWORD:-algo_local}@postgres:5432/algo_trade
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=algo_trade
      - DB_USER=algo
      - DB_PASSWORD=${DB_PASSWORD:-algo_local}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-dev-secret-local-docker-algo-trader}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - algo-net

  # Redis — cache, pub/sub fallback, nonce manager, semantic cache, embeddings
  # Persistence: AOF + RDB via config/redis.conf
  # Auth: password via REDIS_PASSWORD env var (optional — backward compatible)
  # If REDIS_PASSWORD is set, --requirepass is added; otherwise no auth required.
  redis:
    image: redis:7-alpine
    container_name: algo-trade-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    command:
      - 'sh'
      - '-c'
      # $$ escapes docker-compose var substitution; shell expands at runtime
      # If REDIS_PASSWORD is empty/unset, --requirepass is omitted (backward compatible)
      - 'redis-server /usr/local/etc/redis/redis.conf $${REDIS_PASSWORD:+--requirepass $${REDIS_PASSWORD}}'
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: ['CMD-SHELL', 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - algo-net

  # NATS — primary event-driven message bus + JetStream
  nats:
    image: nats:2.10-alpine
    container_name: algo-trade-nats
    restart: unless-stopped
    ports:
      - '4222:4222'   # Client connections
      - '8222:8222'   # HTTP monitoring
    command: ['--jetstream', '--store_dir', '/data', '-m', '8222', '--auth', '${NATS_TOKEN:-changeme}']
    volumes:
      - nats_data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8222/healthz']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - algo-net

  # PostgreSQL — primary database (marketplace, auth, billing, trades)
  postgres:
    image: postgres:16-alpine
    container_name: algo-trade-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=algo
      - POSTGRES_PASSWORD=${DB_PASSWORD:-algo_local}
      - POSTGRES_DB=algo_trade
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U algo -d algo_trade']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - algo-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: algo-trade-prometheus
    restart: unless-stopped
    ports:
      - '9092:9090'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus-alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - algo-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: algo-trade-grafana
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - algo-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: algo-trade-alertmanager
    restart: unless-stopped
    ports:
      - '9093:9093'
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - prometheus
    networks:
      - algo-net

networks:
  algo-net:
    driver: bridge

volumes:
  redis_data:
  nats_data:
  pg_data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
