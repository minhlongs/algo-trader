# Base compose — app + essential infrastructure
# For full production stack: ./scripts/start-production.sh

services:
  algo-trade:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algo-trade
    restart: unless-stopped
    ports:
      - '4000:3000' # API + /metrics
      - '4001:3001' # Dashboard
      - '4002:3002' # Webhooks
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NATS_URL=nats://nats:4222
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - algo-net

  redis:
    image: redis:7-alpine
    container_name: algo-trade-redis
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - algo-net
    volumes:
      - redis_data:/data

  nats:
    image: nats:2-alpine
    container_name: algo-trade-nats
    restart: unless-stopped
    command: ['-js', '-m', '8222']
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 4222']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - algo-net
    volumes:
      - nats_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: algo-trade-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=algo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-algo_pass}
      - POSTGRES_DB=algo_trade
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U algo']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - algo-net

networks:
  algo-net:
    driver: bridge

volumes:
  redis_data:
  nats_data:
  postgres_data:
