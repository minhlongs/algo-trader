# Cloudflare Workers Configuration
# This worker acts as edge proxy for the algo-trade API
# Main app runs on VPS (Docker), CF provides CDN + DDoS protection

name = "algo-trader"
main = "src/platform/workers/edge-proxy.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Production (default)
[vars]
ENVIRONMENT = "production"
REGION_ROUTING_ENABLED = "false"

# Paper trading loop — enabled via PAPER_TRADING_ENABLED=true
PAPER_TRADING_ENABLED = "true"
PAPER_TRADING_SYMBOLS = "BTC/USD,ETH/USD,SOL/USD,AVAX/USD"
PAPER_TRADING_INTERVAL_MS = "300000"
PAPER_TRADING_MAX_CONCURRENT = "5"
PAPER_TRADING_HOLD_DURATION_MS = "3600000"

# KV namespace for edge caching
[[kv_namespaces]]
binding = "CACHE"
id = "6c7199c0259b42db943aa13b200d8ea1"
preview_id = "ca8f3f11882e426e952e322963077f73"

# Durable Objects - Sharding Architecture
[[durable_objects.bindings]]
name = "SHARD_MANAGER"
class_name = "ShardManager"

[[durable_objects.bindings]]
name = "SHARD_0"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_1"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_2"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_3"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_4"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_5"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_6"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_7"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_8"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_9"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_10"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_11"
class_name = "StrategyShard"

# D1 database for subscriptions, coupons, payment logs
[[d1_databases]]
binding = "SUBSCRIBERS"
database_name = "algo-trader-db"
database_id = "f29559f2-8e0b-461a-bd01-5665581beeee"
migrations_dir = "src/shared/db/migrations"

# Migrations for DO deployment
[[migrations]]
tag = "v1-sharding"
new_classes = ["ShardManager", "StrategyShard"]

# Route: api.cashclaw.cc/* through zone routing
[[routes]]
pattern = "api.cashclaw.cc/*"
zone_name = "cashclaw.cc"

# Build config
[build]
command = "npx tsc -p tsconfig.worker.json"

# Cron trigger: health self-check every 5 minutes
[triggers]
crons = ["*/5 * * * *"]

# Add environment-specific configurations for multi-region workers
#
# `routes = []` on every env block is REQUIRED, not cosmetic. An env that omits
# `routes` inherits the top-level [[routes]] above, and deploying that env
# reassigns api.cashclaw.cc/* away from the production Worker onto it. Wrangler
# warns about exactly this (cli.js: "Deploying this environment will reassign
# these custom domains away from the top-level Worker"). Keep this list in sync
# if a new [env.*] is ever added.
[env.staging]
name = "algo-trader-staging"
routes = []
[env.staging.vars]
ENVIRONMENT = "staging"

[env.us-east]
name = "algo-trader-us-east"
routes = []
[env.us-east.vars]
ENVIRONMENT = "us-east"

[env.eu-central]
name = "algo-trader-eu-central"
routes = []
[env.eu-central.vars]
ENVIRONMENT = "eu-central"

[env.ap-southeast]
name = "algo-trader-ap-southeast"
routes = []
[env.ap-southeast.vars]
ENVIRONMENT = "ap-southeast"
