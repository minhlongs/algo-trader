# Cloudflare Workers Configuration
# This worker acts as edge proxy for the algo-trade API
# Main app runs on VPS (Docker), CF provides CDN + DDoS protection

name = "algo-trader"
main = "src/workers/edge-proxy.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Production (default)
[vars]
ENVIRONMENT = "production"

# KV namespace for edge caching
[[kv_namespaces]]
binding = "CACHE"
id = "6c7199c0259b42db943aa13b200d8ea1"
preview_id = "ca8f3f11882e426e952e322963077f73"

# Hyperdrive connection pools for backend services
# Create these with: wrangler hyperdrive create <name>
[[hyperdrive]]
binding = "HYPERDRIVE_POLYMARKET"
id = "hyperdrive-id-placeholder" # Replace with actual Hyperdrive ID

[[hyperdrive]]
binding = "HYPERDRIVE_LLM_GATEWAY"
id = "hyperdrive-id-placeholder" # Replace with actual Hyperdrive ID

[[hyperdrive]]
binding = "HYPERDRIVE_EXCHANGE_API"
id = "hyperdrive-id-placeholder" # Replace with actual Hyperdrive ID

# Durable Objects - Sharding Architecture
[[durable_objects.bindings]]
name = "SHARD_MANAGER"
class_name = "ShardManager"

[[durable_objects.bindings]]
name = "SHARD_0"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_1"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_2"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_3"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_4"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_5"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_6"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_7"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_8"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_9"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_10"
class_name = "StrategyShard"

[[durable_objects.bindings]]
name = "SHARD_11"
class_name = "StrategyShard"

# Migrations for DO deployment
[[migrations]]
tag = "v1-sharding"
new_classes = ["ShardManager", "StrategyShard"]

# Staging
[env.staging]
name = "algo-trader-staging"
[env.staging.vars]
ENVIRONMENT = "staging"

# Multi-region deployments
[env.us-east]
name = "algo-trader-us-east"
[env.us-east.vars]
ENVIRONMENT = "us-east"
REGION_ROUTING_ENABLED = "true"

[env.eu-central]
name = "algo-trader-eu-central"
[env.eu-central.vars]
ENVIRONMENT = "eu-central"
REGION_ROUTING_ENABLED = "true"

[env.ap-southeast]
name = "algo-trader-ap-southeast"
[env.ap-southeast.vars]
ENVIRONMENT = "ap-southeast"
REGION_ROUTING_ENABLED = "true"

# Build config
[build]
command = "npx tsc -p tsconfig.worker.json"

# Custom domain (configure in CF dashboard)
# routes = [{ pattern = "api.yourdomain.com/*", zone_name = "yourdomain.com" }]
