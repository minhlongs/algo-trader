name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-algo-trader
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}

jobs:
  # Job 1: Build & Test
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          CI: true

      - name: Build
        run: pnpm build

  # Job 2: Docker Build & Push
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            latest

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 3: Deploy to VPS
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'EOF'
            set -e
            cd /opt/algo-trader

            # Pull latest code
            git pull origin main

            # Pull Docker image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Create shared network for cross-service communication
            docker network create algo-trader_algo-net 2>/dev/null || true

            # Stop old containers (all compose files)
            docker compose -f docker-compose.yml -f docker/monitoring/docker-compose.monitoring.yml down || true

            # Start full stack: app + redis + nats + prometheus + grafana
            docker compose -f docker-compose.yml -f docker/monitoring/docker-compose.monitoring.yml up -d

            # Wait for health check
            echo "Waiting for services to be healthy..."
            sleep 30

            # Health checks
            echo "=== Health Checks ==="
            curl -f http://localhost:3000/api/health && echo " API: OK" || echo " API: FAIL"
            curl -f http://localhost:9090/-/healthy && echo " Prometheus: OK" || echo " Prometheus: FAIL"
            curl -f http://localhost:3030/api/health && echo " Grafana: OK" || echo " Grafana: SKIP"
            wget -qO- http://localhost:8222/healthz && echo " NATS: OK" || echo " NATS: FAIL"
            redis-cli -h localhost ping 2>/dev/null && echo " Redis: OK" || echo " Redis: SKIP"

            # Final API health (required)
            curl -f http://localhost:3000/api/health || exit 1

            # Clean up old images
            docker image prune -af

            echo "Deployment successful!"
          EOF

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi

  # Job 4: Health Check
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check API health
        run: |
          curl -f https://${{ secrets.VPS_HOST }}/health || exit 1

      - name: Check metrics endpoint
        run: |
          curl -f https://${{ secrets.VPS_HOST }}/metrics || exit 1

      - name: Verify Grafana
        run: |
          curl -f https://${{ secrets.VPS_HOST }}/grafana/login || exit 1

      # ════════════════════════════════════════════════════════════
      # k6 Load Test (post-deploy smoke check)
      # ════════════════════════════════════════════════════════════
      - name: Checkout code for k6 script
        uses: actions/checkout@v4

      - name: k6 Load Test (CI variant)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/raas-gateway-load-test.ci.js
          flags: --summary-trend-stats="avg,p(95),p(99)"
        env:
          API_HOST: ${{ secrets.VPS_HOST }}
          API_PORT: '443'
          VUS: '50'
          DURATION: 20s
