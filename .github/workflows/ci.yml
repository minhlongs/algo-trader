name: CI

# AI-First 5 Enforcement Gates (Solo Platform PDF, Pillar 1)
# Each job maps 1:1 to a named gate. A failure surfaces which gate blocked the PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate-1-validation:
    name: Gate 1 — Validation (tsc + lint + strategies + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create data directory for SQLite tests
        run: mkdir -p data
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src/ --max-warnings 50
      - name: Validate strategies
        run: node scripts/validate-strategies.mjs
      - name: Run tests
        run: npx vitest run

  gate-2-security:
    name: Gate 2 — Security scan (secrets + audit critical)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Secret scan (hard fail)
        run: node scripts/ci-gate-secret-scan.mjs
      - name: Dependency audit (critical hard fail)
        run: pnpm audit --audit-level=critical
      - name: Dependency audit (high — advisory)
        run: pnpm audit --audit-level=high || echo "::warning::high-severity advisories present; track in tech debt"

  gate-3-quality:
    name: Gate 3 — Quality (eslint strict + file size policy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint changed files only (PR)
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- 'src/**/*.ts' 'src/**/*.tsx' | tr '\n' ' ')
          if [ -z "$CHANGED" ]; then
            echo "No src/ TypeScript changes — skip strict lint."
            exit 0
          fi
          echo "Linting: $CHANGED"
          npx eslint $CHANGED --max-warnings 0
      - name: File-size policy (warn if >400 LOC in src/)
        run: |
          violators=$(find src -type f \( -name '*.ts' -o -name '*.tsx' \) -not -path '*/__tests__/*' \
            -exec awk 'END{ if (NR > 400) print FILENAME " : " NR }' {} \;)
          if [ -n "$violators" ]; then
            echo "::warning::Files exceed 400 LOC (soft cap):"
            echo "$violators"
          fi

  gate-4-dependency:
    name: Gate 4 — Dependency hygiene (lockfile + outdated)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify lockfile is in sync
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: List outdated (advisory only)
        run: pnpm outdated --long || true

  gate-5-deployment-smoke:
    name: Gate 5 — Deployment smoke (prod URLs after merge)
    runs-on: ubuntu-latest
    needs: [gate-1-validation, gate-2-security, gate-3-quality, gate-4-dependency]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Wait for CF Pages to propagate
        run: sleep 45
      - name: Production smoke test
        run: node scripts/ci-gate-deploy-smoke.mjs

  gate-6-paper-gate-lock:
    name: Gate 6 — Paper Gate Date Lock (Pillar 1 doctrine)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify QWEN_LIVE_ELIGIBLE=true is not committed as an assignment
        run: bash scripts/ci-gate-paper-gate-lock.sh
