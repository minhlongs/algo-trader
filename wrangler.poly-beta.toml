# Isolated Cloudflare Worker Configuration for POLY-G5 Release A (Public Beta)
#
# SAFETY INVARIANTS:
# 1. Dedicated Worker name `poly-beta-api` — NEVER touches `algo-trader` Worker.
# 2. Private Worker routing: `workers_dev = false`, `preview_urls = false`, `routes = []` —
#    reachable ONLY via internal Cloudflare Pages Service Binding (`POLY_BETA_API`).
# 3. `LIVE_TRADING_ENABLED = "false"` — hard-locked to simulated $100 paper portfolio.
# 4. Default-deny market data (`MARKET_DATA_ENABLED = "false"`) and explicit maintenance
#    (`MAINTENANCE_MODE = "true"`) — zero outbound Gamma/CLOB/RPC egress until authorized.
# 5. Separate D1 (`poly-beta-db`), separate KV (`POLY_BETA_KV`), separate DO (`TenantPaperEngine`).

name = "poly-beta-api"
main = "src/platform/poly-beta/poly-beta-worker.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = []

[vars]
ENVIRONMENT = "public-beta"
LIVE_TRADING_ENABLED = "false"
MAINTENANCE_MODE = "true"
MARKET_DATA_ENABLED = "false"
TARGET_MARKET = "INTERNATIONAL"
TARGET_VIETNAM_CUSTOMERS = "false"
PRODUCT_LANGUAGE = "en"
ACCOUNTING_CURRENCY = "USD"
SIGNUP_GATE_MODE = "allowlist"
G1_SOAK_LOCK = "locked"
G2_POLY_SHADOW_LOCK = "locked"
ALLOWED_ORIGINS = "https://poly-beta-dashboard.pages.dev"
POLYMARKET_PUBLIC_GAMMA_URL = "https://gamma-api.polymarket.com"
POLYMARKET_PUBLIC_CLOB_URL = "https://clob.polymarket.com"

# BETA_SIGNUP_ALLOWLIST and BETA_SIGNUP_INVITES are intentionally omitted from
# wrangler.poly-beta.toml. When unset, signup fails closed (403 SIGNUP_ALLOWLIST_REQUIRED
# / INVITE_PROOF_UNAVAILABLE). Enroll USER_001 only after explicit Founder approval via:
#   wrangler secret put BETA_SIGNUP_ALLOWLIST --config wrangler.poly-beta.toml
#   node scripts/poly-beta-issue-invite.mjs --email <user001> --ttl-hours 24
#   wrangler secret put BETA_SIGNUP_INVITES --config wrangler.poly-beta.toml

# Local development overrides (`wrangler dev --config wrangler.poly-beta.toml --env dev`)
# keep localhost origins out of the production `public-beta` SameSite=None cookie surface.
[env.dev.vars]
ENVIRONMENT = "dev"
LIVE_TRADING_ENABLED = "false"
MAINTENANCE_MODE = "true"
MARKET_DATA_ENABLED = "false"
TARGET_MARKET = "INTERNATIONAL"
TARGET_VIETNAM_CUSTOMERS = "false"
PRODUCT_LANGUAGE = "en"
ACCOUNTING_CURRENCY = "USD"
SIGNUP_GATE_MODE = "allowlist"
G1_SOAK_LOCK = "locked"
G2_POLY_SHADOW_LOCK = "locked"
ALLOWED_ORIGINS = "https://poly-beta-dashboard.pages.dev,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173"
POLYMARKET_PUBLIC_GAMMA_URL = "https://gamma-api.polymarket.com"
POLYMARKET_PUBLIC_CLOB_URL = "https://clob.polymarket.com"

[[durable_objects.bindings]]
name = "TENANT_PAPER_ENGINE"
class_name = "TenantPaperEngine"

[[migrations]]
tag = "v1-poly-beta-engine"
new_sqlite_classes = ["TenantPaperEngine"]

# Placeholder IDs below are populated at isolated beta resource creation in Phase 8
# and never reference production `algo-trader-db` (`f29559f2-...`) or `CACHE` (`6c7199c0-...`).
[[d1_databases]]
binding = "POLY_BETA_DB"
database_name = "poly-beta-db"
database_id = "9abb7e79-aeae-452e-a626-d913bc2a8a51"
migrations_dir = "migrations/poly-beta-d1"

[[kv_namespaces]]
binding = "POLY_BETA_KV"
id = "d6bbbfe9aab64ea88a15ec3d51714430"
