route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'default'
      repeat_interval: 4h

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:9999/webhook-placeholder'
        send_resolved: true

  - name: 'critical'
    webhook_configs:
      - url: 'http://localhost:9999/webhook-placeholder'
        send_resolved: true
