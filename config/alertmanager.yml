# Alertmanager Configuration — Algo-Trader
# ============================================================
# Routes: all alerts to Telegram-critical receiver via webhook bridge.
# Webhook target: alert-webhook service at port 8080.
# For native Telegram Alertmanager receiver (bot token mode):
#   Use config/alertmanager.yml.tpl with TELEGRAM_BOT_TOKEN
# ============================================================

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'telegram-critical'

receivers:
  # Default receiver — Telegram webhook bridge.
  # Uses alert-webhook service that forwards to Telegram.
  - name: 'default'
    webhook_configs:
      - url: 'http://alert-webhook:8080/telegram'
        send_resolved: true

  # Critical alerts receiver — Telegram with same webhook.
  - name: 'critical'
    webhook_configs:
      - url: 'http://alert-webhook:8080/telegram'
        send_resolved: true

  # Telegram-critical receiver (explicit name for route targeting)
  - name: 'telegram-critical'
    webhook_configs:
      - url: 'http://alert-webhook:8080/telegram'
        send_resolved: true
