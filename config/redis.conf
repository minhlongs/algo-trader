# Redis Configuration — Algo-Trader
# ============================================================
# Persistence: Append-Only File (AOF) + RDB snapshots
# Security: password authentication via REDIS_PASSWORD env var
#
# The password is injected via docker-compose --requirepass flag
# so this file can remain generic (no hardcoded credentials).
#
# If REDIS_PASSWORD is unset/empty, Redis starts without auth
# (backward compatible — a warning is emitted in docker-compose).
# ============================================================

# AOF persistence — every write, fsync every second
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshot intervals (save <seconds> <changes>)
save 900 1       # 15 min if at least 1 key changed
save 300 10      # 5 min if at least 10 keys changed
save 60 10000    # 1 min if at least 10000 keys changed

# Memory management (same as current compose defaults)
maxmemory 512mb
maxmemory-policy allkeys-lru

# Network
bind 0.0.0.0
port 6379

# Latency / reliability
timeout 0
tcp-keepalive 300
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Logging
loglevel notice
logfile ""
