groups:
  - name: algo-trade-critical
    interval: 30s
    rules:
      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Circuit breaker is OPEN'
          description: 'Trading circuit breaker triggered. Investigate immediately.'

      - alert: DailyLossThresholdExceeded
        expr: daily_pnl_usd < -50
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Daily loss exceeded threshold'
          description: 'Daily P&L is {{ $value | humanize }}. Trading may be halted.'

      - alert: ProviderDown
        expr: market_data_provider_availability == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Provider {{ $labels.exchange }} is DOWN'
          description: 'Provider has been unavailable for > 1 minute.'
