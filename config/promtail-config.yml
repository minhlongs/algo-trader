# Promtail Configuration — algo-trader log shipper
# Reads container logs from Docker and forwards to Loki

server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ── Docker container logs ──────────────────────────────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Use container name as the primary label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Capture compose service name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      # Capture compose project name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      # Capture container log stream (stdout/stderr)
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'

    pipeline_stages:
      # Parse JSON log lines from structured logger
      - docker: {}
      - match:
          selector: '{container="algo-trade"}'
          stages:
            - json:
                expressions:
                  level: level
                  message: message
                  service: service
                  traceId: traceId
            - labels:
                level:
                service:
            - timestamp:
                source: timestamp
                format: RFC3339Nano
